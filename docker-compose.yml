services:

  postgres:
    image: postgres:16
    container_name: secureops-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secureops

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build:
      context: ./backend

    container_name: secureops-backend

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env.docker

    restart: unless-stopped

volumes:
  postgres_data: