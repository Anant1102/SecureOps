name: SecureOps Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: anant1102/secureops-backend

jobs:
  secureops-ci:

    name: Build • Test • Scan • Docker • ZAP • Helm

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

    ####################################################################
    # Checkout Repository
    ####################################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ####################################################################
    # Setup Python
    ####################################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: backend/requirements.txt

    ####################################################################
    # Install Backend Dependencies
    ####################################################################

    - name: Install Dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install \
          pytest \
          bandit \
          pip-audit

    ####################################################################
    # Verify Installation
    ####################################################################

    - name: Verify Python
      run: |
        python --version
        pip --version

    ####################################################################
    # Run Unit Tests
    ####################################################################

    - name: Run Unit Tests
      working-directory: backend
      run: |
        pytest || true

    ####################################################################
    # Static Application Security Testing
    ####################################################################

    - name: Run Bandit
      working-directory: backend
      run: |
        bandit -r app || true

    ####################################################################
    # Dependency Vulnerability Scan
    ####################################################################

    - name: Dependency Audit
      working-directory: backend
      run: |
        pip-audit || true

    ####################################################################
    # Docker Login
    ####################################################################

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    ####################################################################
    # Build Docker Image
    ####################################################################

    - name: Build Docker Image
      run: |
        docker build \
          -t $IMAGE_NAME:latest \
          -t $IMAGE_NAME:${{ github.sha }} \
          ./backend

    ####################################################################
    # Push Docker Images
    ####################################################################

    - name: Push Docker Images
      run: |
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ github.sha }}

        ####################################################################
    # Docker Compose Up
    ####################################################################

    - name: Start SecureOps Stack
      run: |
        docker compose up -d --build

    ####################################################################
    # Wait for PostgreSQL
    ####################################################################

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        sleep 20

    ####################################################################
    # Wait for Backend
    ####################################################################

    - name: Wait for Backend
      run: |
        echo "Waiting for Backend..."
        sleep 30

    ####################################################################
    # Show Running Containers
    ####################################################################

    - name: Docker Containers
      run: |
        docker ps

    ####################################################################
    # Health Check
    ####################################################################

    - name: Backend Health Check
      run: |
        curl --retry 20 \
             --retry-delay 5 \
             --retry-all-errors \
             http://localhost:5000/health

    ####################################################################
    # Verify Home API
    ####################################################################

    - name: Verify Home API
      run: |
        curl http://localhost:5000/

    ####################################################################
    # Show Available URLs
    ####################################################################

    - name: Application Information
      run: |
        echo "===================================="
        echo "SecureOps Application Started"
        echo "===================================="
        echo ""
        echo "Backend:"
        echo "http://localhost:5000"
        echo ""
        echo "Health:"
        echo "http://localhost:5000/health"
        echo ""
        echo "Auth:"
        echo "http://localhost:5000/api/auth/login"
        echo ""
        echo "===================================="

    ####################################################################
    # OWASP ZAP Baseline Scan
    ####################################################################

    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.14.0
      with:
        target: "http://localhost:5000"
        rules_file_name: ".zap/rules.tsv"
        cmd_options: "-a"

    ####################################################################
    # Trivy Image Scan
    ####################################################################

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}:latest
        format: table
        exit-code: "0"
        ignore-unfixed: true
        severity: HIGH,CRITICAL

    ####################################################################
    # Install Helm
    ####################################################################

    - name: Install Helm
      uses: azure/setup-helm@v4

    ####################################################################
    # Helm Lint
    ####################################################################

    - name: Helm Lint
      run: |
        helm lint helm/secureops

    ####################################################################
    # Helm Template
    ####################################################################

    - name: Helm Template Validation
      run: |
        helm template secureops helm/secureops

    ####################################################################
    # Upload Helm Chart
    ####################################################################

    - name: Upload Helm Files
      uses: actions/upload-artifact@v4
      with:
        name: helm-chart
        path: helm/secureops

    ####################################################################
    # Upload Security Reports
    ####################################################################

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          backend

    ####################################################################
    # Docker Logs
    ####################################################################

    - name: Docker Logs
      if: always()
      run: |
        docker compose logs

    ####################################################################
    # Shutdown Containers
    ####################################################################

    - name: Stop Containers
      if: always()
      run: |
        docker compose down -v
