apiVersion: apps/v1
kind: Deployment

metadata:
  name: secureops-backend
  namespace: secureops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secureops-backend

  template:
    metadata:
      labels:
        app: secureops-backend

    spec:

      containers:
      - name: backend

        image: anant1102/secureops-backend:v1
        imagePullPolicy: Always

        ports:
          - containerPort: 5000

        envFrom:
          - configMapRef:
              name: backend-config

          - secretRef:
              name: backend-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10